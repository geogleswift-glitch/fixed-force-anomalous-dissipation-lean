name: Lean build and axiom audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free disk space for Mathlib and proof exports
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Restore project build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: lean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lean-comparator-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build with the pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check submission layout and pinned metadata
        run: python3 verification/check-layout.py
      - name: Check public declarations and the exact unconditional statement
        shell: pwsh
        run: |
          lake env lean verification/Audit.lean
          if ($LASTEXITCODE -ne 0) { throw 'Public declaration check failed' }
          lake env lean verification/UnconditionalStatement.lean
          if ($LASTEXITCODE -ne 0) { throw 'Unconditional statement check failed' }
      - name: Run the kernel axiom audit
        shell: pwsh
        run: ./verification/Check-Axioms.ps1
