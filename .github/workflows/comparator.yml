name: Protected Comparator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free disk space for Mathlib and proof exports
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Restore project build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: lean-comparator-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-comparator-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lean-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Set up the pinned Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check submission layout and pinned metadata
        run: python3 verification/check-layout.py
      - name: Check out the pinned Palomar preparation and sandbox tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: .lake/palomar-pipeline
          persist-credentials: false
      - name: Set up the official preparation Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Set up the official license detector
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
          working-directory: .lake/palomar-pipeline
      - name: Install pinned official preparation dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r .lake/palomar-pipeline/requirements.txt
      - name: Run official source preparation on the exact private commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-palomar-preparation.sh
      - name: Prepare the protected Linux Comparator sandbox
        shell: bash
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          sandbox_path=$(bash .lake/palomar-pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")
          dirname "$sandbox_path" >> "$GITHUB_PATH"
      - name: Run protected Comparator with NanoDa and con-ron
        shell: bash
        run: bash scripts/verify-comparator.sh
      - name: Save preparation and Comparator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: palomar-preparation-and-comparator-evidence
          path: |
            ${{ runner.temp }}/preparation-report.json
            ${{ runner.temp }}/comparator.log
          if-no-files-found: warn
